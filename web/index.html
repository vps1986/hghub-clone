<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e0e11;--card:#1a1a1f;--card2:#22222a;--text:#f5f5f5;--muted:#9a9aa3;--line:#2a2a32;--accent:#ff2d55;--accent2:#ff6b81}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:30;background:rgba(14,14,17,.96);border-bottom:1px solid var(--line);padding:10px 12px 0}
.topbar{display:flex;align-items:center;gap:10px}
.logo{font-size:24px;font-weight:900;letter-spacing:.5px;color:#fff;white-space:nowrap}
.logo b{color:var(--accent)}
.search{flex:1;display:flex;gap:6px}
.search input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--text);padding:8px 14px;font-size:14px;outline:none}
.search button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);font-size:15px;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--accent);font-weight:700}
main{padding:12px;max-width:1100px;margin:0 auto}
section[hidden]{display:none}
.hint{color:var(--muted);font-size:13px;margin:8px 2px}
.feed{height:calc(100dvh - 118px);min-height:480px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:16px;background:#000}
.slide{position:relative;height:100%;scroll-snap-align:start;overflow:hidden;cursor:pointer}
.slide img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,transparent 55%,rgba(0,0,0,.88) 100%)}
.slide .info{position:absolute;left:0;right:72px;bottom:0;padding:18px 14px}
.slide .info h3{font-size:19px;line-height:1.35;margin-bottom:6px}
.slide .info p{color:#d8d8de;font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .meta{color:var(--muted);font-size:12px;margin-top:8px}
.slide .acts{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:16px;align-items:center}
.slide .acts button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer}
.slide .acts button.liked{color:var(--accent);border-color:var(--accent)}
.slide .acts span{font-size:12px;color:#fff;text-align:center;margin-top:-10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#222}
.card .t{padding:8px 10px}
.card .t h4{font-size:14px;line-height:1.35;height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .t p{color:var(--muted);font-size:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--card);border:1px solid var(--line);color:#ddd;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rankrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;cursor:pointer}
.rankrow .no{font-size:20px;font-weight:900;width:30px;text-align:center;color:var(--accent)}
.rankrow img{width:64px;height:86px;object-fit:cover;border-radius:8px}
.rankrow h4{font-size:15px;line-height:1.4}
.rankrow p{color:var(--muted);font-size:12px;margin-top:4px}
.post{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer}
.post h4{font-size:15px;line-height:1.5}
.post p{color:#cfcfd6;font-size:13px;line-height:1.6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post .meta{color:var(--muted);font-size:12px;margin-top:8px}
.mebox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.mebox h3{font-size:16px;margin-bottom:10px}
.mebox input,.mebox select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font-size:14px;margin:6px 0;outline:none}
.btn{background:linear-gradient(135deg,#ff2d55,#ff7a59);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:#ddd}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;overflow-y:auto;padding:12px}
.modal .box{max-width:900px;margin:0 auto}
.modal video{width:100%;max-height:62vh;background:#000;border-radius:12px}
.modal .close{position:sticky;top:6px;float:right;z-index:2;background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.modal h2{font-size:19px;line-height:1.4;margin:12px 0 6px}
.modal .desc{color:#cfcfd6;font-size:13px;line-height:1.7;white-space:pre-wrap}
.modal .eps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.modal .eps button{background:var(--card2);border:1px solid var(--line);color:#eee;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.modal .eps button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ctl select{background:var(--card2);border:1px solid var(--line);color:#eee;border-radius:8px;padding:8px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:36px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;display:none}
footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 0 26px}
@media (max-width:640px){.feed{height:calc(100dvh - 112px);border-radius:12px}.slide .info h3{font-size:17px}}
/* 1.2.0.2 沉浸式：首页时隐藏顶栏，feed 占满整屏 */
body.immersive header{display:none}
body.immersive main{padding:0;max-width:none}
body.immersive .feed{height:100dvh;border-radius:0}
body.immersive footer{display:none}
.heartpop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:90px;color:#ff2d55;pointer-events:none;animation:pop .7s ease forwards;z-index:5}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1) translateY(-30px);opacity:0}}
.slide video.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.newbanner{position:sticky;top:0;z-index:40;margin:8px auto;text-align:center;background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;max-width:320px}
.feedend{display:flex;align-items:center;justify-content:center;height:40%;color:var(--muted);font-size:14px;scroll-snap-align:start}
</style>

<body>

    <div class="logo">HG<b>hub</b></div>

</main>
<footer>HGhub · 短剧 · 复刻版 1.2.0.3 · 全部 3361 部无限滚动 · 每 10 分钟自动检查更新</footer>
<div class="modal" id="player" hidden>
  <div class="box">
    <button class="close" id="btnClosePlayer">✕</button>
    <video id="video" controls playsinline preload="auto"></video>
    <div class="ctl">
      <select id="speedSel" title="倍速">

      </select>
      <button class="btn ghost" id="btnLike">♥ 点赞</button>

      <button class="btn ghost" id="btnNextEp">下一集</button>

  </div>
</div>

<script>
var UP = 'https://huangguoai.com';
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
var store = {
  get: function(k, d){ try { var v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
var feedItems = [], catItems = [], curVideo = null, curEp = 1, curStreams = {}, curDetail = null, hls = null;
var playCache = {}; /* "id:ep" -> streams，直连/代理共用，预加载下一集用 */
var preloadSet = {};
function playKey(id, ep){ return id + ':' + ep; }
/* 封面本地缓存：Cache API 存 /proxy/img 解密后的 JPEG，第二次打开不走网络 */
var COVER_CACHE = 'hg-covers-v1';
function primeCoverCache(root){
  if (!('caches' in window)) return;
  (root || document).querySelectorAll('img[data-raw]').forEach(function(img){
    var proxyUrl = img.getAttribute('src');
    if (!proxyUrl || proxyUrl.indexOf('/proxy/img') !== 0) return;
    caches.open(COVER_CACHE).then(function(c){
      return c.match(proxyUrl).then(function(hit){
        if (hit) return hit.blob();
        return fetch(proxyUrl).then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          var clone = r.clone();
          c.put(proxyUrl, clone).catch(function(){});
          return r.blob();
        });
      }).then(function(blob){
        if (blob && blob.size > 1000) img.src = URL.createObjectURL(blob);
      }).catch(function(){});
    });
  });
}
/* 预加载：提前拿下一集播放链接 + 拉一次清单，点下一集时直接起播 */
async function preloadPlay(id, ep){
  var k = playKey(id, ep);
  if (preloadSet[k] || playCache[k]) return;
  preloadSet[k] = true;
  try {
    var r = await fetch('/api/play', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:id, ep:ep})});
    var d = await r.json();
    var st = (d.data && d.data.streams) || d.streams || {};
    var src = st.main || st.hevc || st.preview;
    if (src){ playCache[k] = st; fetch('/proxy/m3u8?url=' + encodeURIComponent(src)).catch(function(){}); }
  } catch(e){}
}
/* 观看进度：每 5 秒存一次，续播用 */
function saveProgress(){
  var v = $('#video');
  if (!curVideo || !v || !v.duration || v.currentTime < 10) return;
  var prog = store.get('hg_progress', {});
  prog[curVideo] = {ep: curEp, t: Math.floor(v.currentTime), dur: Math.floor(v.duration), at: Date.now()};
  store.set('hg_progress', prog);
}
function getProgress(id){ return store.get('hg_progress', {})[id] || null; }
function esc(s){ return String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 封面图修复：pic.drleao.cn 下发的封面是 AES-128-CBC 加密过的字节，
// 浏览器直接当 <img> 加载永远显示不出来（见 web/server.py 的 /proxy/img）。
// 所以封面一律走本站同源代理：服务端先拉取再解密，返回正常 JPEG。
// 直连地址只作兜底（onerror 时换回原地址，部分旧图可能是明文）。
function coverSrc(url){
  if (!url) return '';
  if (url.indexOf('/proxy/img?url=') === 0) return url;
  return '/proxy/img?url=' + encodeURIComponent(url);
}
function coverImg(url, cls){
  // data-raw 存原地址：代理失败时 onerror 换回直连地址再试一次。
  return '<img class="' + (cls || '') + '" loading="lazy" src="' + esc(coverSrc(url)) +
    '" data-raw="' + esc(url || '') + '" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.onerror=null;this.src=this.dataset.raw;}" alt="">';
}
document.addEventListener('error', function(e){
  var t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset && t.dataset.raw && !t.dataset.fb){
    t.dataset.fb = 1; t.src = t.dataset.raw;
  }
}, true);
function fmtN(n){ n = +n || 0; if (n >= 10000) return (n / 10000).toFixed(1) + '万'; return String(n); }
function fmtDur(s){ s = +s || 0; var m = Math.floor(s / 60), ss = s % 60; return m + ':' + String(ss).padStart(2, '0'); }
function toast(t){ var el = $('#toast'); el.textContent = t; el.style.display = 'block'; setTimeout(function(){ el.style.display = 'none'; }, 2200); }
function hashStr(s){ var h = 0; for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return 'h' + h; }
async function api(path){
  var urls = [UP + path, '/api/up/' + path.replace(/^\/api\//, '')];
  var lastErr = null;
  for (var i = 0; i < urls.length; i++){
    try {
      var r = await fetch(urls[i], {headers: {'Accept': 'application/json'}});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var j = await r.json();
      if (j && j.data !== undefined) return j;
      return {data: j};
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('请求失败');
}
function itemsOf(j){
  if (!j) return [];
  var d = j.data !== undefined ? j.data : j;
  if (Array.isArray(d)) return d;
  if (d && Array.isArray(d.items)) return d.items;
  if (d && Array.isArray(d.list)) return d.list;
  if (d && Array.isArray(d.videos)) return d.videos;
  return [];
}
/* 1.2.0.3 分页：上游 /api/videos 每页 20 条，?page=N 翻页，limit 无效。
   实测 2026-11-11：全部 3361 部 / 169 页；分类 cate_id=24:1518部/76页，
   25:113部/6页，26:832部/42页，27:898部/45页；搜索 /api/search?q= 分页；
   帖子 /api/posts 749 条/38 页；/api/feed/today 只有 23 条，不能当主列表；
   榜单 /api/ranks/* 只返回前 20，page 参数无效，无法翻页。 */
function pagOf(j){
  var d = j && j.data !== undefined ? j.data : j;
  var p = (d && d.pagination) || {};
  return {page: p.page || 1, pages: p.pages || 1, size: p.size || 20, total: p.total || 0};
}
var feedState = {page: 0, pages: 1, total: 0, loading: false, done: false};
var catState = {cat: '', page: 0, pages: 1, total: 0, loading: false, done: false};
var searchState = {q: '', page: 0, pages: 1, total: 0, loading: false, done: false};
var postState = {page: 0, pages: 1, total: 0, loading: false, done: false};
function dedupeAppend(list, items){
  var seen = {};
  list.forEach(function(v){ seen[v.id] = true; });
  var added = [];
  items.forEach(function(v){ if (!seen[v.id]){ seen[v.id] = true; list.push(v); added.push(v); } });
  return added;
}
function updateTotal(el, shown, total){
  if (!el) return;
  el.textContent = total ? ('全部 ' + total + ' 部 · 已加载 ' + shown + ' 部') : ('已加载 ' + shown + ' 部');
}
function isLiked(id){ return !!store.get('hg_likes', {})[id]; }
function isFav(id){ return store.get('hg_fav', []).some(function(x){ return x.id === id; }); }
function toggleLike(v){
  var likes = store.get('hg_likes', {});
  likes[v.id] = !likes[v.id];
  store.set('hg_likes', likes);
  toast(likes[v.id] ? '已点赞' : '已取消点赞');
  $$('[data-like="' + v.id + '"]').forEach(function(b){ b.classList.toggle('liked', likes[v.id]); b.textContent = likes[v.id] ? '♥' : '♡'; });
}
function toggleFav(v){
  var f = store.get('hg_fav', []);
  var i = f.findIndex(function(x){ return x.id === v.id; });
  if (i >= 0){ f.splice(i, 1); toast('已取消收藏'); }
  else { f.unshift({id: v.id, title: v.title, cover: v.cover}); toast('已收藏'); }
  store.set('hg_fav', f);
  $$('[data-fav="' + v.id + '"]').forEach(function(b){ b.textContent = isFav(v.id) ? '★' : '☆'; });
  if (!$('#view-me').hidden) renderMe();
}
function addHistory(v, ep){
  var h = store.get('hg_history', []).filter(function(x){ return x.id !== v.id; });
  h.unshift({id: v.id, title: v.title, cover: v.cover, ep: ep || 1, t: Date.now()});
  store.set('hg_history', h.slice(0, 50));
}
function slideHtml(v, i){
  var liked = isLiked(v.id), fav = isFav(v.id);
  return '<div class="slide" data-id="' + v.id + '" data-i="' + i + '">' +
    coverImg(v.cover, 'cover') +
    '<div class="shade"></div>' +
    '<div class="info"><h3>' + esc(v.title || '') + '</h3>' +
    '<p>' + esc((v.description || '').slice(0, 90)) + '</p>' +
    '<div class="meta">' + esc((v.author && v.author.name) || '') + ' · ' + (v.episode_count || v.total_episodes || '') + '集 · ♥ ' + fmtN(v.like_count) + ' · ★ ' + fmtN(v.collect_count) + '</div></div>' +
    '<div class="acts">' +
    '<button data-like="' + v.id + '" class="' + (liked ? 'liked' : '') + '">' + (liked ? '♥' : '♡') + '</button><span>♥ ' + fmtN(v.like_count) + '</span>' +
    '<button data-fav="' + v.id + '">' + (fav ? '★' : '☆') + '</button><span>收藏</span>' +
    '<button data-play="' + v.id + '">▶</button><span>播放</span>' +
    '</div></div>';
}
function cardHtml(v){

/* 沉浸式 feed：滚轮/触摸上下滑切集；滑到哪集就预加载那集和下一集 */
var _feedInit = false, _touchY = null;
function initFeedSwipe(box){
  if (_feedInit) return; _feedInit = true;
  box.addEventListener('wheel', function(e){
    e.preventDefault();
    var cur = Math.round(box.scrollTop / box.clientHeight);
    var next = Math.max(0, Math.min(feedItems.length - 1, cur + (e.deltaY > 0 ? 1 : -1)));
    box.scrollTo({top: next * box.clientHeight, behavior: 'smooth'});
  }, {passive: false});
  box.addEventListener('touchstart', function(e){ _touchY = e.touches[0].clientY; }, {passive: true});
  box.addEventListener('touchend', function(e){
    if (_touchY === null) return;
    var dy = e.changedTouches[0].clientY - _touchY; _touchY = null;
    if (Math.abs(dy) < 60) return;
    var cur = Math.round(box.scrollTop / box.clientHeight);
    var next = Math.max(0, Math.min(feedItems.length - 1, cur + (dy < 0 ? 1 : -1)));
    box.scrollTo({top: next * box.clientHeight, behavior: 'smooth'});
  }, {passive: true});
  /* 可见的 slide 触发预加载（全局 observer，新追加的 slide 也要 observe） */
  if (!window._slideIO){
    window._slideIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (!en.isIntersecting) return;
        var id = +en.target.getAttribute('data-id');
        preloadPlay(id, 1);
        var i = +en.target.getAttribute('data-i');
        if (feedItems[i + 1]) preloadPlay(feedItems[i + 1].id, 1);
      });
    }, {root: box, threshold: 0.6});
  }
  window._observeSlides = function(root){
    root.querySelectorAll('.slide').forEach(function(s){ window._slideIO.observe(s); });
  };
  window._observeSlides(box);
  /* 1.2.0.3 无限滚动：滑到 feed 底部附近自动加载下一页，直到全部加载完 */
  box.addEventListener('scroll', function(){
    if (feedState.loading || feedState.done) return;
    if (box.scrollTop + box.clientHeight >= box.scrollHeight - box.clientHeight * 1.5) loadHomeNext();
  }, {passive: true});
}
function findVideo(id){
  var all = feedItems.concat(catItems);
  for (var i = 0; i < all.length; i++) if (+all[i].id === +id) return all[i];
  return {id: id, title: '', cover: ''};
}

async function loadHome(){
  var box = $('#feed');
  feedState = {page: 0, pages: 1, total: 0, loading: false, done: false};
  feedItems = [];
  box.innerHTML = '<div class="empty">加载中...</div>';

async function loadHomeNext(isFirst){
  var box = $('#feed');
  if (feedState.loading || feedState.done) return;
  feedState.loading = true;
  var nextPage = feedState.page + 1;
  try {
    var j = await api('/api/videos?page=' + nextPage);
    var items = itemsOf(j);
    var pg = pagOf(j);
    feedState.page = pg.page; feedState.pages = pg.pages; feedState.total = pg.total;
    if (!items.length){ feedState.done = true; }
    var added = dedupeAppend(feedItems, items);
    var html = added.map(function(v, k){
      var idx = feedItems.indexOf(v);
      return slideHtml(v, idx);
    }).join('');
    if (isFirst){
      box.innerHTML = html || '<div class="empty">暂无内容</div>';
      feedItems.slice(0, 3).forEach(function(v){ preloadPlay(v.id, 1); });
      initFeedSwipe(box);
    } else {
      var endEl = box.querySelector('.feedend');
      if (endEl) endEl.remove();
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      while (tmp.firstChild) box.appendChild(tmp.firstChild);
      bindClicks(box);
      if (window._observeSlides) window._observeSlides(box);
    }
    if (feedState.page >= feedState.pages || !items.length){
      feedState.done = true;
      var end = document.createElement('div');
      end.className = 'feedend';
      end.textContent = '已加载全部 ' + feedState.total + ' 部';
      box.appendChild(end);
    }
    updateTotal($('#homeTotal'), feedItems.length, feedState.total);
    if (isFirst) bindClicks(box);
  } catch(e){
    if (isFirst) box.innerHTML = '<div class="empty">加载失败：' + esc(e.message || e) + '，请下拉刷新或稍后再试</div>';
    else toast('加载下一页失败：' + (e.message || e));
  } finally {

/* 1.2.0.3 自动更新：打开时比对首页第一页的 ID 和总数，有新剧就提示；
   每 10 分钟后台静默刷新第一页，只提示不打断当前浏览；点横幅重新加载。 */
var _refreshTimer = null;
function knownSet(){
  return {ids: store.get('hg_known_ids', []), total: store.get('hg_known_total', 0)};
}
function saveKnown(ids, total){
  store.set('hg_known_ids', ids.slice(0, 60));
  store.set('hg_known_total', total);
}
async function checkUpdates(silent){
  try {
    var j = await api('/api/videos?page=1');
    var items = itemsOf(j);
    var pg = pagOf(j);
    var known = knownSet();
    var oldIds = {};
    known.ids.forEach(function(id){ oldIds[id] = true; });
    var fresh = items.filter(function(v){ return !oldIds[v.id]; });
    var totalDiff = Math.max(0, pg.total - (known.total || pg.total));
    var newCount = Math.max(fresh.length, totalDiff);
    if (!known.ids.length){
      saveKnown(items.map(function(v){ return v.id; }), pg.total);
      return 0;
    }
    saveKnown(items.map(function(v){ return v.id; }), pg.total);
    if (newCount > 0){
      var banner = $('#newBanner');
      if (banner){
        banner.textContent = '有 ' + newCount + ' 部新更新，点击查看';
        banner.hidden = false;
        banner.onclick = function(){ banner.hidden = true; loadHome(); };
      }
      if (!silent) toast('发现 ' + newCount + ' 部新更新');
      return newCount;
    }
    return 0;
  } catch(e){ return 0; }
}
function startAutoRefresh(){
  if (_refreshTimer) return;
  checkUpdates(true);
  _refreshTimer = setInterval(function(){ checkUpdates(true); }, 10 * 60 * 1000);
}

async function playVideo(id, ep){

  $$('#pEps button').forEach(function(b){ b.classList.toggle('on', +b.getAttribute('data-ep') === curEp); });
  var v = $('#video');
  try {
    var st = playCache[playKey(id, curEp)];
    if (!st){
      var r = await fetch('/api/play', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: id, ep: curEp})});
      var d = await r.json();
      if (!r.ok) throw new Error((d && (d.error || d.msg)) || ('HTTP ' + r.status));
      st = (d.data && d.data.streams) || d.streams || {};
      playCache[playKey(id, curEp)] = st;
    }
    curStreams = st;
    var want = $('#streamSel').value || 'main';
    var src = st[want] || st.main || st.hevc || st.preview;
    if (!src) throw new Error('未拿到播放地址');
    setPlayerSource(src);
    var fv = findVideo(id);
    if (fv) addHistory(fv, curEp);
    preloadPlay(id, curEp + 1); /* 边播边预加载下一集 */
    /* 续播：上次看到一半，自动跳回上次位置 */
    var prog = getProgress(id);
    if (prog && prog.ep === curEp && prog.t > 10 && prog.dur && prog.t < prog.dur - 10){
      var _trySeek = function(){ try { v.currentTime = prog.t; } catch(e){} };
      v.addEventListener('loadedmetadata', _trySeek, {once: true});
      setTimeout(_trySeek, 800);
      toast('已续播到 ' + fmtDur(prog.t));
    }
  } catch(e){
    toast('播放失败：' + (e.message || e));

function setPlayerSource(src, tried){
  var v = $('#video');

  var url = (line === 'direct') ? src : '/proxy/m3u8?url=' + encodeURIComponent(src);
  if (window.Hls && Hls.isSupported()){
    if (hls) { try { hls.destroy(); } catch(e){} }
    hls = new Hls({maxBufferLength: 30});
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, function(ev, data){
      if (data && data.fatal && !tried){
        var next = (line === 'direct') ? 'proxy' : 'direct';
        toast((line === 'direct' ? '直连' : '代理') + '线路失败，尝试' + (next === 'direct' ? '直连' : '代理') + '...');
        store.set('hg_line', next);
        setPlayerSource(src, true);
      }
    });
    v.play().catch(function(){});
  } else if (v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = url;
    v.play().catch(function(){});
    v.addEventListener('error', function(){
      if (!tried){
        var next = (line === 'direct') ? 'proxy' : 'direct';
        store.set('hg_line', next);
        setPlayerSource(src, true);
      }
    }, {once: true});
  } else {
    v.src = url;
  }
}

  html += '<div class="mebox"><h3>观看历史（' + hist.length + '）</h3>' +
    (hist.length ? hist.map(function(h){
      return '<div class="rankrow" data-id="' + h.id + '">' + coverImg(h.cover) + '<div><h4>' + esc(h.title || '') + '</h4><p>看到第 ' + (h.ep || 1) + ' 集 · ' + new Date(h.t).toLocaleString() + '</p></div></div>';
    }).join('') : '<p class="hint">还没有观看记录</p>') + '</div>';
  html += '<div class="mebox"><h3>设置</h3>' +
    '<label class="hint">播放线路</label>' +
    '<select id="lineSel"><option value="direct"' + (line === 'direct' ? ' selected' : '') + '>线路 1：直连 CDN（默认，最快）</option><option value="proxy"' + (line === 'proxy' ? ' selected' : '') + '>线路 2：8080 代理（备用）</option></select>' +
    '<div class="rowbtns"><button class="btn ghost" id="btnClearHist">清空观看历史</button><button class="btn ghost" id="btnClearFav">清空收藏</button></div>' +
    '<p class="hint">HGhub 复刻版 1.2.0.3 · 全部内容无限滚动（首页 3361 部）· 每 10 分钟自动检查更新 · 详情每次打开重新拉最新集数</p></div>';
  box.innerHTML = html;
  bindClicks(box);
  var bl = $('#btnLogin');
  if (bl) bl.onclick = function(){
    var name = $('#loginUser').value.trim(), pw = $('#loginPass').value;
    var acc = store.get('hg_accounts', {});
    if (name && acc[name] === hashStr(pw)){ store.set('hg_user', {name: name}); toast('登录成功'); renderMe(); }
    else toast('账号或密码不正确');
  };
  var br = $('#btnReg');
  if (br) br.onclick = function(){
    var name = $('#loginUser').value.trim(), pw = $('#loginPass').value;
    if (!name || pw.length < 4){ toast('用户名不能为空，密码至少 4 位'); return; }
    var acc = store.get('hg_accounts', {});
    if (acc[name]){ toast('该用户名已被注册'); return; }
    acc[name] = hashStr(pw);
    store.set('hg_accounts', acc);
    store.set('hg_user', {name: name});
    toast('注册并登录成功');
    renderMe();
  };
  var bo = $('#btnLogout');
  if (bo) bo.onclick = function(){ store.set('hg_user', null); toast('已退出'); renderMe(); };
  var ls = $('#lineSel');
  if (ls) ls.onchange = function(){ store.set('hg_line', ls.value); toast('已切换为 ' + ls.options[ls.selectedIndex].text); };
  var ch = $('#btnClearHist');
  if (ch) ch.onclick = function(){ store.set('hg_history', []); toast('已清空观看历史'); renderMe(); };
  var cf = $('#btnClearFav');
  if (cf) cf.onclick = function(){ store.set('hg_fav', []); toast('已清空收藏'); renderMe(); };
}
function showView(name){
  document.body.classList.toggle('immersive', name === 'home');
  $$('#nav button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-view') === name); });
  ['home', 'cat', 'rank', 'posts', 'me', 'search'].forEach(function(v){ var el = $('#view-' + v); if (el) el.hidden = (v !== name); });
  if (name === 'home' && !feedItems.length) loadHome();
  if (name === 'cat') loadCats();
  if (name === 'rank') loadRank('hot');
  if (name === 'posts') loadPosts();
  if (name === 'me') renderMe();
  if (name === 'search') loadHotTags();
  window.scrollTo(0, 0);
}
$('#nav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-view]');
  if (b) showView(b.getAttribute('data-view'));
});
/* 1.2.0.3 页面级无限滚动：分类/搜索/帖子滑到页面底部附近自动加载下一页 */
window.addEventListener('scroll', function(){
  if (window.innerHeight + window.scrollY < document.body.scrollHeight - 800) return;
  if (!$('#view-cat').hidden) loadCatNext();
  else if (!$('#view-search').hidden) loadSearchNext();
  else if (!$('#view-posts').hidden) loadPostNext();
}, {passive: true});
$$('#rankTabs .chip').forEach(function(b){
  b.onclick = function(){
    $$('#rankTabs .chip').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    loadRank(b.getAttribute('data-type'));
  };
});
$('#btnSearch').onclick = function(){ doSearch($('#q').value); };
$('#q').addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch(e.target.value); });
$('#btnClosePlayer').onclick = closePlayer;
$('#speedSel').onchange = function(){ var v = $('#video'); v.playbackRate = parseFloat(this.value); };
$('#streamSel').onchange = function(){
  if (curVideo && curStreams){
    var want = this.value;
    var src = curStreams[want] || curStreams.main;
    if (src) setPlayerSource(src);
  }
};
$('#btnLike').onclick = function(){ if (curVideo) toggleLike(findVideo(curVideo)); };
$('#btnFav').onclick = function(){ if (curVideo) toggleFav(findVideo(curVideo)); };
$('#btnShare').onclick = function(){
  var u = location.origin + '/?v=' + curVideo;
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(function(){ toast('链接已复制'); }, function(){ toast(u); }); }
  else toast(u);
};
$('#btnPrevEp').onclick = function(){ if (curVideo && curEp > 1) playVideo(curVideo, curEp - 1); };
$('#btnNextEp').onclick = function(){ if (curVideo) playVideo(curVideo, curEp + 1); };
$('#video').addEventListener('ended', function(){ if (curVideo){ var total = curDetail && (curDetail.episode_count || curDetail.total_episodes); if (!total || curEp < total) playVideo(curVideo, curEp + 1); } });
$('#video').addEventListener('timeupdate', function(){ if (Math.floor(this.currentTime) % 5 === 0) saveProgress(); });
$('#video').addEventListener('pause', saveProgress);
loadHotTags();
loadHome();
</script>
</body>
</html>
