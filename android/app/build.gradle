plugins {
    id("com.android.application")
}

android {
    namespace = "com.hghub.huangguo"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.hghub.huangguo"
        minSdk = 24
        targetSdk = 34
        versionCode = 120
        versionName = "1.2.0"
        // 复刻版网页的部署地址，构建时注入，仓库里不写死服务器 IP。
        //   ./gradlew assembleDebug -PappUrl=http://YOUR_SERVER_IP:8081/
        // 不传则默认值为空，首次打开时在应用内输入一次（保存在本地）。
        // Muse 托管的 fullstack artifact 没有公开链接，填入部署后的地址再构建。
        buildConfigField("String", "APP_URL", "\"${project.findProperty("appUrl") ?: ""}\"")
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        debug {
            debuggable = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
}
